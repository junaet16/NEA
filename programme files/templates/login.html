<!DOCTYPE html>
<html>
<head>
    <!-- Character encoding for proper text rendering -->
    <meta charset="UTF-8">

    <!-- Title shown in the browser tab -->
    <title>Title of Programme</title>

    <!-- Stylesheet for the login page -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loginStyle.css') }}">
</head>

<body class="page">

    <!-- Main page title -->
    <h1 class="title">Welcome</h1>
    <!-- Don't have a name inside of programme -- just say welcome -->

    <!-- Container holding the login form and messages -->
    <div class="container">

        <!-- Login / Sign-up form -->
        <form class="loginForm" method="POST">

            <!-- Username input field -->
            <input
                class="textInput"
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <!-- Password input field -->
            <input
                class="textInput"
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <!-- Container for login and sign-up buttons -->
            <div class="buttonRow">
                <!-- Login button submits the form with actionName=login -->
                <button class="button" type="submit" name="actionName" value="login">
                    Login
                </button>

                <!-- Sign-up button submits the form with actionName=signUp -->
                <button class="button" type="submit" name="actionName" value="signUp">
                    Sign Up
                </button>
            </div>

        </form>

        <!-- Displays feedback messages from the server (e.g. login errors) -->
        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}

    </div>

</body>
</html>
